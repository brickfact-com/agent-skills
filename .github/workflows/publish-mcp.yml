name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the public helper
        run: python3 -m unittest discover -s tests -v
      - name: Download and verify the signature verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cosign"
          gh release download v3.0.6 --repo sigstore/cosign --pattern cosign-linux-amd64 --dir "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' 'c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74' "$RUNNER_TEMP/cosign/cosign-linux-amd64" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cosign/cosign-linux-amd64"
          ln -s "$RUNNER_TEMP/cosign/cosign-linux-amd64" "$RUNNER_TEMP/cosign/cosign"
          printf '%s\n' "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      - name: Download and verify the official publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          gh release download "$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry --pattern "$archive" --pattern "$archive.sigstore.json"
          printf '%s  %s\n' '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4' "$archive" | sha256sum --check
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate registry metadata
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub Actions identity
        run: ./mcp-publisher login github-oidc
      - name: Publish the hosted server metadata
        run: ./mcp-publisher publish

name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the public helper
        run: python3 -m unittest discover -s tests -v
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the official publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 90 --output "$archive" "$base_url/$archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 90 --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          printf '%s  %s\n' '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4' "$archive" | sha256sum --check
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate registry metadata
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub Actions identity
        run: ./mcp-publisher login github-oidc
      - name: Publish the hosted server metadata
        run: ./mcp-publisher publish
